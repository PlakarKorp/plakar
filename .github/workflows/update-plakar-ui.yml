name: Update Plakar UI

on:
  workflow_dispatch:
    inputs:
      plakar-branch:
        description: "Branch to build the UI from and to open the PR against"
        required: true
        default: "main"

jobs:
  update-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout plakar
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.plakar-branch }}

      # 41ff72655975bd51cab0327fa583b6e92b6d3061 == v4.2.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Copy dist to ui/web/build
        run: |
          rm -rf -- ./ui/web/build
          mkdir -p ./ui/web/build
          cp -r ./web/apps/oss/dist/* ./ui/web/build/

      - name: Get the commit SHA
        id: plakar
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.event.inputs.plakar-branch }}
          branch: update-plakar-ui/${{ github.event.inputs.plakar-branch }}
          add-paths: ui/web/build
          delete-branch: true
          author: "Plakup <noreply@plakar.io>"
          committer: "Plakup <noreply@plakar.io>"
          title: Update Plakar UI to ${{ github.event.inputs.plakar-branch }}@${{ steps.plakar.outputs.sha }}
          body: Update Plakar UI to ${{ github.event.inputs.plakar-branch }}@${{ steps.plakar.outputs.sha }}
          commit-message: Update Plakar UI to ${{ github.event.inputs.plakar-branch }}@${{ steps.plakar.outputs.sha }}
