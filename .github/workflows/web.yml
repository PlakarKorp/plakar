name: Web

on:
  pull_request:
    paths:
      - "ui/web/src/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "ui/web/src/**"
      - ".github/workflows/web.yml"
  # Dispatched by dependabot-dedupe.yml after it pushes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint&Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web/src

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
          package_json_file: ui/web/src/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ui/web/src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Releases ship what make ui builds: build it here too, so a build error
      # shows up on the PR rather than on the release branch.
      - run: make ui
        working-directory: .
