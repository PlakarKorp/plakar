name: Web

on:
  pull_request:
    paths:
      - "ui/web/src/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "ui/web/src/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  check:
    name: Lint&Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web/src

    steps:
      - uses: actions/checkout@v4
      # 41ff72655975bd51cab0327fa583b6e92b6d3061 == v4.2.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          run_install: false
          package_json_file: ui/web/src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ui/web/src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Releases ship what make ui builds: build it here too, so a build error
      # shows up on the PR rather than on the release branch.
      - run: make ui
        working-directory: .
