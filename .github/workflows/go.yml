name: Go

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # A PR touching only ui/web/src/ skips the build job instead of not starting
  # the workflow: a skipped job satisfies a required check, a missing one does
  # not.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - id: filter
      run: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^1 HEAD | grep -qv '^ui/web/src/'; then
          echo "go=false" >> "$GITHUB_OUTPUT"
        else
          echo "go=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: |
        go build -v ./...
        go build tool

    # Produce a coverage profile (Codecov coverage) and a JUnit XML (Codecov
    # Test Analytics) in one run. The `timeout -s QUIT 5m` wrapper is kept so a
    # hung test still dumps goroutine stacks. continue-on-error + explicit exit
    # keeps the upload steps reachable on failure (that is when test results are
    # most useful); a later step re-surfaces the failure.
    - name: Test
      id: gotest
      continue-on-error: true
      run: |
        set -o pipefail
        set +e # disable errexit
        # -p 4 caps how many package test binaries run at once. Several
        # packages (api, diag, maintenance) each spin up pebble caches and do
        # real encryption/snapshot work; with the default parallelism they
        # over-subscribe the runner's cores, starve each other, and blow the
        # per-test timeout -- which kills the whole package and reports every
        # test in it as failed-to-return to Codecov. Capping concurrency keeps
        # the run both fast and reliable.
        timeout -s QUIT 5m go test -v -p 4 -coverprofile=coverage.out -covermode=atomic -timeout 2m -json ./... > out.json
        status=$?
        if [ $status -ne 0 ]; then
          jq -j 'select(.Output != null) | .Output' out.json
        fi
        go tool go-junit-report -parser gojson -set-exit-code < out.json > junit.xml
        echo "test_exit=$status" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./junit.xml
        report_type: test_results
        fail_ci_if_error: false

    - name: Fail if tests failed
      if: ${{ steps.gotest.outputs.test_exit != '0' }}
      run: exit 1
