name: release

on:
  push:
    # run only against version tags
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Evaluates to the string "true" or "false". true if tag-name doesn't
      # contain a hyphen (eg. v1.2.3-dev, 1.2.4-nightly), false otherwise.
      # GoReleaser templates consume this as a string comparison for the
      # conditional :latest container tag.
      MAKE_LATEST_RELEASE: ${{ contains(github.ref_name, '-') == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release tags carry the built UI (see "Releasing" in README.md). It must
      # be built from this tag's sources: a patch release branch inherits the
      # previous release's build, and the UI keeps no compatibility with an
      # older or newer API. make ui stamps the sources it built from.
      - name: Check the UI is built in, from this tag's sources
        run: |
          want=$(git rev-parse HEAD:ui/web/src)
          got=$(cat ui/web/build/.src-tree 2>/dev/null || true)
          if [ ! -f ui/web/build/index.html ] || [ "$got" != "$want" ]; then
            echo "::error::ui/web/build is missing or was not built from this tag's ui/web/src (built from '${got:-nothing}', want '$want'): run make release-ui on the release branch and commit before tagging."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # To enable goreleaser-pro, uncomment the following line
          # distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          MAKE_LATEST_RELEASE: ${{ env.MAKE_LATEST_RELEASE }}
          # If using goreleaser-pro, uncomment the following line
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

