name: Test Plakar Package Installation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  test-apt:
    name: Test APT
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update system and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl sudo gnupg2

      - name: Add Plakar APT repository
        run: |
          curl -fsSL https://www.plakar.io/dist/keys/community-v1.1.0.gpg | sudo gpg --dearmor -o /usr/share/keyrings/community-v1.1.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/community-v1.1.0.gpg] https://www.plakar.io/dist/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/plakar.list
          sudo apt-get update

      - name: Install Plakar
        run: |
          sudo apt-get install -y plakar

      - name: Verify installation
        run: |
          plakar version || (echo "❌ Plakar failed to install correctly" && exit 1)

  test-rpm:
    name: Test RPM (Fedora)
    runs-on: ubuntu-latest
    permissions: {}
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y curl gnupg2

      - name: Add Plakar RPM repository
        run: |
          cat <<EOF | tee /etc/yum.repos.d/plakar.repo
          [plakar]
          name=Plakar Repository
          baseurl=https://www.plakar.io/dist/repos/rpm/$(uname -m)/
          enabled=1
          gpgcheck=0
          gpgkey=https://www.plakar.io/dist/keys/community-v1.1.0.gpg
          EOF

      - name: Install Plakar
        run: |
          dnf install -y plakar

      - name: Verify installation
        run: |
          plakar version || (echo "❌ Plakar failed to install correctly" && exit 1)

  test-homebrew:
    name: Test Homebrew (on Linux)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential procps curl file git

      - name: Install Homebrew
        run: |
          curl -fsSL -o install.sh https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
          NONINTERACTIVE=1 bash install.sh

      - name: Install Plakar
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install plakar

      - name: Verify installation
        run: |
          /home/linuxbrew/.linuxbrew/bin/plakar version || (echo "❌ Plakar failed to install correctly" && exit 1)

  test-homebrew-tap:
    name: Test Homebrew tap (on Linux)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential procps curl file git

      - name: Install Homebrew
        run: |
          curl -fsSL -o install.sh https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
          NONINTERACTIVE=1 bash install.sh

      - name: Install Plakar
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install plakarkorp/tap/plakar

      - name: Verify installation
        run: |
          /home/linuxbrew/.linuxbrew/bin/plakar version || (echo "❌ Plakar failed to install correctly" && exit 1)
